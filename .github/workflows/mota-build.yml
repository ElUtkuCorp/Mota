# Mota: compila los binarios armv7 y, al publicar una release, los adjunta en el formato que espera el
# actualizador integrado (los mismos nombres que Valetudo más valetudo_release_manifest.json con sus SHA-256).
# - push a main, pull request o ejecución manual: binarios como artefactos de la ejecución.
# - release publicada: además, se adjuntan a la release. La etiqueta debe coincidir con "version" de package.json,
#   porque el actualizador compara la versión del manifiesto con la de la release.
name: Compilación de Mota

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-armv7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm

      - name: Comprobar que la etiqueta coincide con la versión
        if: github.event_name == 'release'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${{ github.event.release.tag_name }}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "La etiqueta $TAG no coincide con la versión $VERSION de package.json" >&2
            exit 1
          fi

      # Los runtimes Node de pkg vienen en build_dependencies/pkg (los de upstream).
      - name: Instalar dependencias
        run: npm ci

      - name: Generar el esquema OpenAPI
        run: npm run build_openapi_schema

      - name: Compilar el frontend
        run: npm run build --workspace=frontend

      - name: Compilar armv7
        run: npm run build_armv7 --workspace=backend

      - name: Compilar armv7 lowmem
        run: npm run build_armv7_lowmem --workspace=backend

      # El robot tiene poco espacio en la partición del binario: el actualizador pide la versión .upx
      - name: Comprimir con UPX
        run: npm run upx

      - name: Generar el manifiesto de la release
        run: npm run build_release_manifest

      - name: Preparar binarios, manifiesto y SHA256SUMS
        run: |
          mkdir -p dist
          cp build/armv7/valetudo dist/valetudo-armv7
          cp build/armv7/valetudo-lowmem dist/valetudo-armv7-lowmem
          cp build/armv7/valetudo.upx dist/valetudo-armv7.upx
          cp build/armv7/valetudo-lowmem.upx dist/valetudo-armv7-lowmem.upx
          cp build/valetudo_release_manifest.json dist/
          cd dist
          sha256sum valetudo-armv7 valetudo-armv7-lowmem valetudo-armv7.upx valetudo-armv7-lowmem.upx > SHA256SUMS
          cat SHA256SUMS valetudo_release_manifest.json

      - name: Subir artefactos
        uses: actions/upload-artifact@v7
        with:
          name: mota-armv7-${{ github.sha }}
          path: dist/*

      - name: Adjuntar a la release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
